# Keybinding exceptions
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Kill pane" x kill-pane
bind -N "Create window at current path" C new-window -c "#{pane_current_path}"

# Allmux smart windows and splits
bind -N "Create smart window" c run-shell 'allmux new-pane #{q:pane_current_command} "#{pane_pid}" #{q:pane_current_path}'
bind -N "Split pane horizontally" % run-shell 'allmux split-horizontal #{q:pane_current_command} "#{pane_pid}" #{q:pane_current_path}'
bind -N "Split pane vertically" '"' run-shell 'allmux split-vertical #{q:pane_current_command} "#{pane_pid}" #{q:pane_current_path}'

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "[#S] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
# Expand auto names at redraw time; status changes do not trigger a tmux rename.
set -g window-status-format '#[fg=default] #{E:@aimux_tab_name} '
set -g window-status-current-format '#[fg=default] #{E:@aimux_tab_name} '
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

#-------------------------------------------------
#------------------- CUSTOM ----------------------
#-------------------------------------------------
set -g status-position bottom
set -g renumber-windows off

# # preserve style in popup windows
set -g popup-style bg=default,fg=default
set -gw @aimux_tab_bg '#{?#{==:#{@aimux_status},working},blue,#{?#{==:#{@aimux_status},blocked},red,#{?#{==:#{@aimux_status},done},green,brightblack}}}'
set -gw @aimux_tab_fg '#{?#{==:#{E:@aimux_tab_bg},brightblack},brightwhite,black}'
set -gw @aimux_agent_name '#{&&:#{@aimux_status},#{&&:#{!:#{pane_dead}},#{!:#{m:docker*,#{pane_current_command}}}}}'
set -gw @aimux_tab_name '#{?automatic-rename,#{?#{E:@aimux_agent_name},#[push-default]#[fg=#{E:@aimux_tab_fg}#,bg=#{E:@aimux_tab_bg}] #I:#{b;qh:pane_current_path}#{?window_active,*, } #[default]#[pop-default],#I:#{s/[#]/\0\0/:#{E:automatic-rename-format}}#{?window_active,*, }},#I:#W#{?window_active,*, }}'
set -gw automatic-rename-format '#{?#{m:docker*,#{pane_current_command}},@#{b:pane_current_path}@,#{?#{&&:#{!:#{E:@aimux_agent_name}},#{m:*ssh*,#{pane_current_command}}},@#{b:pane_current_path},#{b:pane_current_path}}}'
set -g status-interval 1
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[default]#(~/.local/bin/aimux count)  #[default]#(allmux path #{q:pane_current_path}) "
set -g window-status-current-style none

# Aimux pane lifecycle.
set-hook -g 'pane-focus-in[82]' 'run-shell -b "\"$HOME/.local/bin/aimux\" acknowledge \"#{hook_pane}\""'
set-hook -g 'pane-died[82]' 'run-shell -b "\"$HOME/.local/bin/aimux\" clear \"#{hook_pane}\""'

# Custom popups
bind f display-popup -E -w 75% -h 30% -x C -y '#{e|-:#{client_height},2}' -b none "allmux"
bind -N "Show agent dashboard" a run-shell -C 'display-popup -E -c "#{client_name}" -w 75% -h 70% -x C -y C -e "AIMUX_CLIENT=#{client_name}" "\"\$HOME/.local/bin/aimux\" pick"'

# Cursor color
set -gw cursor-colour '#00ff00'
